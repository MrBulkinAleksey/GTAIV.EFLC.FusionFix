[MAIN]
RecoilFix = 1                                 // make recoil behavior the same as controller when playing with keyboard and mouse
AimingZoomFix = 1                             // -1: TBoGT aiming zoom behaves like IV and TLaD | 0: disable the fix | 1: TBoGT aiming zoom behaves like xbox feature | 2: have this feature also enabled in IV and TLaD

[CAMERASENSITIVITY]
MouseLookSensitivityRange = 0.1, 2.0          // min and max range for mouse look sensitivity slider
GamepadLookSensitivityRange = 0.1, 2.0        // min and max range for gamepad look sensitivity slider
MouseAimSensitivityRange = 0.1, 2.0           // min and max range for mouse aim sensitivity slider
GamepadAimSensitivityRange = 0.1, 2.0         // min and max range for gamepad aim sensitivity slider

[SHADOWS]
ExtraDynamicShadows = 2                       // adds back some missing shadows | 1: to some vegetation | 2: to some fences, grates, roads, walls and some vegetation
CascadeBlendSize = 0.1                        // controls the size of the cascade blending region | [0.0; 1.0]
HighResolutionShadows = 0                     // doubles cascaded shadow map resolution, very GPU intensive
ForceShadowFilter = 0                         // 0: blur quality tied to definition | 1: always use low quality | 2: always use high quality
ExperimentalPlayerShadowAllocation = 2        // night shadow slot allocation with reserved slots for the player | 0: off | 1: observe only, no visual change | 2: enabled
CameraAwareShadowPriority = 1                 // with allocation enabled, gives a bounded preference to lights whose influence reaches the camera view
NativeLampViewPriority = 1                    // with allocation enabled, prefers lamps whose light reaches the view while keeping the game's own lamp choices and shadow caches
ExperimentalOwnHeadlightCasterFix = 1         // excludes the player's vehicle and its occupants from the shadows of its own headlights
ExperimentalCloseHeadlightRelevance = 1       // treats headlights shining right at the player as relevant when choosing night shadow lights
ExperimentalTrafficSelfShadowFix = 1          // excludes approaching traffic vehicles from the shadows of their own headlights while on foot
NearbyVehicleHeadlightReceivers = 1           // on foot, lets headlights that light a nearby visible vehicle cast shadows even when the player is outside the beam
TrafficSignalShadows = 2                      // with allocation enabled, at most this many traffic signals nearest you within the lamp reach cast night shadows, sharing the game's seven shadow slots with lamps | 0: off | up to 7
EmergencyLightShadows = 1                     // with allocation enabled, the flashing lights of up to two emergency vehicles with their sirens on within 30 m (your own first) cast night shadows
ExperimentalShadowDiagnostics = 0             // writes night shadow diagnostics to GTAIV.EFLC.FusionFix.NightShadows.log and a light trace beside it, next to the plugin
ExperimentalCrashDiagnostics = 0              // records crash context to GTAIV-shadow-crash-*.bin next to this ini

[HEADLIGHTS]
ConsistentBrightness = 1                      // headlights of the car you just exited keep the player brightness and range while they stay on
LightModes = 1                                // the headlight control steps through on, high beams and off, instead of switching only the high beams
ShadowBehindLamps = 0.7                       // metres behind the headlights their shadow is drawn from, inside the car, while the light stays where it is: drawn from between the lamps a hand by one of them cut away half of the beam, from further back it casts a shadow of its own size; larger moves the shadows of things near the car further from where the lamps would put them | 0.0 as the game does
OffscreenLights = 1                           // a car's lights go out once the car is out of view where nothing else takes it in, as in tunnels behind the camera; within 35 m of the camera they stay on: 1 for the car you drive or last drove | 2 for every car | 0 as the game does
OffscreenLightsDistance = 100.0               // how far from the camera, in metres, such a car keeps them; high beams reach 75 to 98 m

[FRAMELIMIT]
FrameLimitType = 2                            // 1: realtime (thread-lock)  |  2: accurate (sleep-yield), uses less resources
FpsLimit = -2                                 // used when FPS Limit menu toggle is set to Custom (negative values use refresh rate as a base)
CutsceneFpsLimit = 0                          // custom FPS Limit value in cutscene
LoadingFpsLimit = 30                          // used to avoid game freeze on loading (e.g. Off Route mission)
UnlockFramerateDuringLoadscreens = 1          // game loads faster when using frame limiter
MinigamesFpsLimit = 30                        // used to avoid possible issues for specified minigames in MinigamesList
MinigamesList =                               pool_game, air_hockey, arm_wrestling, tenpinbowl, drinking
MaxFrameLatency = 0                           // Vulkan graphics API only: how many frames the game can get ahead of the screen, fewer is less input latency at some cost to the frame rate | 0: DXVK's own, 3 | 1 to 16. Read at the game's start

[MISC]
DefaultCameraAngleInTLaD = 1                  // enforces the default IV camera angle on bikes in TLaD
PedDeathAnimFixFromTBoGT = 1                  // disables the additional death animation performed after counter attacking peds in IV and TLaD, like in TBoGT
DisableCameraCenteringInCover = 1             // disables the forced camera centering after moving to the edge of a wall while in cover
FirstPersonOnFoot = 1                         // the change camera control goes on from the farthest view on foot to first person, the player hidden from the camera but not from shadows and reflections
FirstPersonForward = 0.1                      // first person camera, metres ahead of the head bone along the view
FirstPersonUp = 0.05                          // first person camera, metres above the head bone
ExtraInfo = 1                                 // shows extra info in the pause menu (e.g. loaded img files amount)
OverrideTreeAlpha = 0.0                       // set to e.g. 0.625, 2.5 or 4.0 for PC, PS3 or X360 tree alpha, respectively
ConsoleCarReflectionsAndDirt = 1              // use stronger console car reflections and any cars can be dirty when they are spawned like console
BrakeLightsWhenStopped = 0                    // lights the players brake lamps while stopped, like AI vehicles do (vanilla only lights them above walking pace)
FixHelicopterSearchlights = 1                 // 0: disabled, searchlights may flicker/fight each other | 1: only one searchlight can be active at a time (for max 10s) | 2: all searchlights can draw independently
AlwaysDisplayHealthOnReticle = 1              // allow game to display NPC health on the reticle when playing with keyboard and mouse
SmoothShorelines = 1                          // makes water edges smooth and adjusts foam noise
SmoothLightVolumes = 1                        // makes light volume edges smooth
NoBloomColorShift = 1                         // prevents bloom threshold from causing wild color shifts when tone mapping is enabled
MenuEnteringDelay = 0                         // 400:  default | 0: no delay
MenuExitingDelay = 0                          // 800:  default | 0: no delay
MenuAccessDelayOnStartup = 0                  // 3000: default | 0: no delay
RadarZoomDelay = 3000                         // 0:    default | 3000: 3s delay
DeathMusic = 0                                // plays cut death music when player is dead in IV
AutoClimbLaddersRange = 1.5                   // how close you must be to auto-climb, in units (the game uses 4.0 for a manual button press)
PlayerJumpRagdollControl = 0                  // allows triggering a ragdoll on demand by pressing the reload key while jumping, like in GTAV
PlayerClimbRagdollControl = 0                 // also allows triggering a ragdoll on demand by pressing the reload key while climbing

[FOG]
VolFogFarClip = 4500.0                        // override far clip for volumetric fog
ExtendedTimecycEditing = 0                    // 0: disabled | 1: display debug info and reload .dat with F3

[BudgetedIV]
VehicleBudget = 0                             // used to avoid "Taxi Bug", may cause vehicle audio issue
PedBudget = 0                                 // may cause issues
ExtendedLimits = 0                            // increases various limits like modelinfo, handling, carcols, some pools size

[EPISODICCONTENT]
EpisodicVehicles = 0                          // Support for APC, Buzzard, smuggler, floater, blade and all their abilities in IV and TLaD
EpisodicWeapons = 0                           // Support for DSR1, Grenade launcher, Pipe bomb, Sticky bomb, AA12 explosive shells, P90 vehicle check, Parachute and all their abilities in IV, TLaD and TBoGT
ExplosiveAnnihilator = 0                      // Enables explosive rounds on Annihilator in IV, requires ep weapons
OtherEpisodicChecks = 0                       // Support for Disco camera bobbing, Cell Phone switching, Altimeter in helicopters and parachute, Explosive sniper and fists cheat in IV and TLaD, requires related ep files
TBoGTHelicopterHeightLimit = 0                // Raises IV and TLaD height limit for helicopters to TBoGT level
TBoGTPoliceWeapons = 0                        // Gives P90 and AA12 to SWAT and FIB and M249 to police in helicopters in IV and TLaD. Requires ep weapons
RemoveSCOSignatureCheck = 0                   // Allows using any episodic SCO on all episodes
EpisodicDeathMusic = 0                        // Allows the restored death music to play in all episodes. Requires custom sound files added per-each episode for it to be unique.

[SUNSHAFTS]
SunShaftsDensity = 0.9                        // How long the rays are. [0.0; 1.0]
SunShaftsDecay = 0.95                         // How fast the rays fade out from the center. [0.0; 1.0]

[POSTFX]
EnablePreAlphaDepth = 1                       // Properly render depth related post-processing effects (e.g depth of field, sunshafts) through windows/transparent objects
ScreenSpaceReflectionsIntensity = 1.0         // 0.0 disables the effect entirely without a restart of the ray march
ScreenSpaceReflectionsMaxDistance = 24.0      // world units a reflection ray travels before giving up
ScreenSpaceReflectionsThickness = 0.3         // extra depth tolerance on top of a ray step, raise if reflections look holey, lower if they smear into streaks
ScreenSpaceReflectionsSteps = 32              // ray march steps, the main cost knob; with ScreenSpaceReflectionsTemporalJitter the accumulation makes up for fewer
ScreenSpaceReflectionsRefineSteps = 8         // binary refinement steps after a hit, sharpens the contact point
ScreenSpaceReflectionsStepPixels = 2.0        // pixels of a reflection ray on screen per march step, up to ScreenSpaceReflectionsSteps; 3.0-4.0 marches faster and leans on ScreenSpaceReflectionsTemporalJitter to fill in what the wider steps skip; Ctrl+Shift+F10 reads it in game
ScreenSpaceReflectionsEdgeFade = 0.1          // screen fraction over which reflections fade out at the borders
ScreenSpaceReflectionsGlossBoost = 2.0        // extra reflection strength on shiny materials like vehicle paint and glass, 0.0 treats every surface the same
ScreenSpaceReflectionsGlossCutoff = 0.5       // surfaces less glossy than this stop reflecting entirely; roads and walls sit around 0.2-0.35, car paint around 0.8
ScreenSpaceReflectionsWetGround = 1.5         // while it rains, roads and pavements reflect too, this many times brighter than the game's own reflection strength for them allows; 1.0 as the game allows (weak on wet roads), 2.0 brighter than the scene they reflect; 0.0 leaves them the game's sky reflection; Ctrl+Shift+F10 reads it and ScreenSpaceReflectionsIntensity again in game
ScreenSpaceReflectionsWaterIntensity = 1.0    // reflection strength on water, 0.0 disables the water pass
ScreenSpaceReflectionsWaterLevelOffset = 0.0  // nudge the reflection plane up or down from the games own water height, in world units
ScreenSpaceReflectionsWaterBlur = 0.5         // how far water reflections soften, in pixels at max ray distance, 0.0 gives a hard mirror
ScreenSpaceReflectionsWaterRipple = 0.65       // how strongly the games own water normal map bends the reflection, 0.0 gives a flat mirror
ScreenSpaceReflectionsPastThinObjects = 1     // 1: a ray that passes behind a thin object such as a trunk carries on and can hit what is behind it | 0: it ends as a miss
ScreenSpaceReflectionsTowardCamera = 0.0      // 0.0: reflections pointing back at the camera fade early, so a ped next to a car does not show in its door from afar | 1.0: they reach further, so a roof seen steeply from above keeps its reflections
ScreenSpaceReflectionsBlur = 0.0               // blur in pixels a reflection reaches at the maximum distance, growing with distance from the surface; 0.0 keeps reflections sharp
ScreenSpaceReflectionsDistanceFade = 0.0       // reflections fade out towards this distance in world units from the surface, so things metres away barely show; 0.0 disables
ScreenSpaceReflectionsFallback = 0.8           // 0.0-1.0: where rays pointing below the horizon find nothing, a blurred guess from the screen fills in, so the player standing in front of what a car reflects leaves no hole in it; 0.0 leaves those spots without reflection
ScreenSpaceReflectionsStepJitter = 1          // 1: each pixel's ray steps are offset to break up banding into fine noise | 0: same steps for every pixel
ScreenSpaceReflectionsSmoothing = 2.0         // radius in pixels of the blur that smooths grainy reflections, 0.0 turns it off
ScreenSpaceReflectionsTemporal = 0.85         // share of the last frames' reflections kept each frame, which steadies them while the camera moves; higher is steadier but lags more, 0.0 turns it off
ScreenSpaceReflectionsTemporalJitter = 1      // 1: while accumulating, the step offsets change every frame and the accumulation averages them, so fewer steps do | 0: the same offsets every frame
PostFxProfiler = 0                            // 1 writes the GPU time of each of FusionFix's effects and of its passes (AO, SSR, contact shadows, indirect light, the game's sun, lamps and light shafts, depth copy, motion vectors, wet ground, water, clouds and their reflections, skin, fog, temporal AA, post processing, HDR output), and the game's own passes by the render target it draws into (shadow maps, G-buffer, reflection maps and so on), to GTAIV.EFLC.FusionFix.PostFx.log next to the plugin every 120 frames
ScreenSpaceReflectionsGBufferNormals = 1      // 1: reflect off the surface normals the game stores | 0: rebuild them from depth, which is too coarse on cars and roads
ScreenSpaceReflectionsGlass = 1               // reflect the surrounding scene in car windows
ScreenSpaceReflectionsGlassLength = 15.0      // world units a car window reflection ray travels
ScreenSpaceReflectionsGlassStepJitter = 1     // 1: offsets each pixel's glass ray steps, leaving fine noise | 0: same steps for every pixel, edges of reflections show as shifted slices
ScreenSpaceReflectionsGlassThickness = 0.5    // how deep behind the scene a car window ray may land and still count as a hit
ContactShadows = 1                            // short screen space shadows towards the sun that ground objects where the shadow map is too coarse; also in the graphics menu
ContactShadowsLength = 0.3                    // world units a contact shadow ray travels towards the sun; longer rays duplicate the shadow map
ContactShadowsThickness = 0.15                // how deep behind the scene a ray may land and still be shadowed, raise if shadows look hollow
ContactShadowsMaxDistance = 60.0              // contact shadows fade out towards this distance from the camera
ContactShadowsStepJitter = 1                  // 1: offsets each pixel's contact shadow steps, turning bands into fine noise that the smoothing hides | 0: same steps for every pixel
ContactShadowsHalfResolution = 1              // 1: contact shadows are marched at half size and brought up to full size by depth, about a quarter of the cost; 0: at full size, crisper at the contact
ContactShadowsTemporal = 0.8                  // share of the last frames' contact shadows kept each frame; the step offsets then change every frame and the noise averages out, 0.0 turns it off
ContactShadowsIntensity = 1.0                 // contact shadow strength, 0.0 turns them off
ScreenSpaceIndirectLight = 1                  // light bounced off nearby surfaces, from what is on screen: a red wall tints the floor next to it; also Indirect Light (SSGI) in the graphics menu
ScreenSpaceIndirectLightIntensity = 1.5       // strength of the bounced light you see; between surfaces the light bounces on at its true strength, so raising it cannot make them light each other up without end
ScreenSpaceIndirectLightMaxBrightness = 4.0   // brightness a single surface may bounce, so headlights, lamps and neon signs do not flare into blotches
ScreenSpaceIndirectLightOcclusion = 1.0       // where the rays find surfaces nearby, the bounced light takes the place of that much of the game's ambient, which stands for the open sky: corners, contact shadows and alleys darken and take the colour of what is around them; 0.0 adds it on top of the full ambient
ScreenSpaceIndirectLightRayLength = 4.0       // world units a ray travels to find a lit surface; longer rays reach further but show more screen space artefacts
ScreenSpaceIndirectLightThickness = 0.5       // how deep behind a surface a ray may land and still count as a hit
ScreenSpaceIndirectLightMaxDistance = 60.0    // fades out towards this distance from the camera
ScreenSpaceIndirectLightRays = 4              // rays per pixel, at half resolution; with Steps the main cost knob
ScreenSpaceIndirectLightSteps = 8             // steps per ray
ScreenSpaceIndirectLightTemporal = 0.9        // share of the last frames' result kept each frame, which smooths the noise of few rays; 0.0 turns it off
SkinScattering = 1                            // light spreading under the skin of people: softer shading on faces, reddish where light turns to shadow; also Skin Scattering (SSS) in the graphics menu, and SSR Debug 9 there shows what counts as skin
SkinScatteringWidth = 0.03                    // metres the light spreads under the skin at most; real skin is a few millimetres, which from a few metres away is under a pixel
SkinScatteringStrength = 1.0                  // how much light spreads under the skin, 1.0 as much as in real skin, up to 2.0; 0.0 turns it off
SkinLighting = 1.0                            // on skin the light of the sun, street lamps and headlights reaches past where it turns to shadow, further in red, and the edges of sun shadows on skin turn reddish; seen from any distance, 0.0 turns it off, up to 2.0
SpecularSheen = 0.1                           // what has no specular map of its own, such as buildings and LOD roads, gets a little sheen: a soft highlight from the sun, street lamps and headlights, and the sky reflected at low angles, most on grey surfaces like asphalt and concrete; 0.0 turns it off, up to 1.0
GGXLighting = 1                               // GGX Lighting in the graphics menu: 0 keeps the game's own highlights everywhere (lamps, headlights, the sun and the sky's reflection), whatever the LightsGGX settings below say
LightsGGX = 1.0                               // highlights of street lamps and headlights on glossy and wet surfaces: a bright core with a long soft tail, long streaks towards the lamps on wet roads, stronger at low angles and weaker on rough surfaces; this is their strength, 0.0 keeps the game's own, up to 4.0
LightsGGXFresnel = 0.5                        // how much brighter those highlights grow when seen at a low angle, as on a road ahead; 0.0 not at all, up to 1.0
LightsGGXSize = 0.05                          // radius of the lamps in metres for their highlights: larger blurs a lamp's reflection into a softer, wider glow, smaller leaves sharp points; up to 2.0
LightsGGXStretch = 0.5                        // how much longer those highlights are drawn towards the lamp than across, the long streaks of lamps on wet roads; 0.0 none, up to 4.0
LightsGGXHeadlights = 0.65                    // half the distance between a car's headlights in metres: the game lights both with one light in the middle, and wet roads now show a streak from each lamp; 0.0 keeps one
LightsGGXFillLights = 0.5                     // some lamps the game draws with no highlight at all get one this strong; 0.0 none, up to 2.0
LightsGGXSun = 1.0                            // the sun's and moon's highlight drawn the same way, this strong; 0.0 keeps the game's own, up to 4.0
LightsGGXEnvironment = 1.0                    // rough surfaces such as concrete and plaster stop reflecting the sky at low angles, asphalt and glossier ones keep the game's look; 0.0 keeps the game's everywhere, values between blend; Ctrl+Shift+F10 reads all these again in game
LightsGGXMax = 2.0                            // the brightest a highlight may get, in the game's own highlight's peak; higher lets glossy and wet surfaces flare, but very glossy cloth, skin and edges can burn white, up to 16.0
LightsGGXSoft = 0.0                           // 0.0 these highlights as above; 1.0 a softer look: much wider glows, and a peak no brighter than the game's own on any surface, so rough walls and roads glow broadly and glossy ones lose their bright core; values between blend
LightsGGXStretchView = 1.0                    // 0.0 stretches the streaks towards the lamp, 1.0 towards the camera, as wet roads show them in photos; only the streak's tail turns; Ctrl+Shift+F10 reads both again in game
LightsGGXGlints = 1.0                         // headlights seen as bright points in car paint, shop windows and wet roads from any side but behind, not only where their beam falls; this is their strength, 0.0 none, up to 8.0
LightsGGXGlintsSize = 0.1                     // radius of a headlight's lamp in metres for those points: larger makes them wider and softer on glossy paint, up to 1.0
LightsGGXGlintsGloss = 0.5                    // how glossy a surface must be to show them: car paint is about 0.8, puddles 0.9, wet roads 0.55, dry asphalt and walls under 0.4; lower lets rougher surfaces glint more
LightsGGXGlintsMax = 64.0                     // the brightest those points may get before Fresnel; lower if they flicker on glossy cars, up to 1000.0; Ctrl+Shift+F10 reads all four again in game
WetWeather = 1                                // Wet Weather in the graphics menu: 0 leaves the ground dry and the rivers and the sea without the rain's rings, whatever the WetGround settings below say
WetGround = 1.0                               // in the rain the ground and buildings get wet: darker and glossy, with puddles on flat ground that the rain rings, so lamps, headlights and the sky shine in them; dries slowly after; 0.0 turns it off
WetGroundPuddles = 0.35                       // share of flat ground under puddles in full rain; 0.0 none, up to 1.0
WetGroundPuddleSize = 24.0                    // metres the puddle pattern takes before it repeats; smaller makes smaller puddles
WetGroundRipples = 1.0                        // strength of the rings raindrops make in puddles and on rivers and the sea; 0.0 none, up to 3.0
WetGroundDarkening = 1.0                      // how much darker wet surfaces turn; 0.0 not at all, up to 2.0
WetGroundWetting = 30.0                       // seconds of game time the ground takes to get fully wet once it rains
WetGroundDrying = 240.0                       // seconds of game time it takes to dry once the rain stops
WetGroundMaterials = 1                        // which kinds of surface get wet, one bit each of the game's material categories 0 to 7 (1 the first only, 9 the first and fourth); WetGroundDebug = 1 shows them in colours
WetGroundDebug = 0                            // 1 paints each material category its own colour (grey 0, red 1, green 2, blue 3, yellow 4, magenta 5, cyan 6, orange 7), 2 shows wetness in red, puddles in green and rings in blue, and rings the rivers and the sea four times stronger than in full rain whatever the weather; on water the rings follow the rain as it falls, not the wetness, so they stop with it
CloudShadows = 0.6                            // cloud shadows drifting over the ground in sunlight, as much as follows from the weather's clouds; this is how much of the sun a full cloud takes away, 0.0 turns them off
CloudShadowsHeight = 1200.0                   // metres up the cloud deck casting them; higher moves the shadows further from below the clouds when the sun is low
CloudShadowsScale = 16000.0                   // metres the cloud pattern takes before it repeats; smaller makes smaller clouds
CloudShadowsWind = 6.0                        // metres a second the shadows drift
CloudShadowsSoftness = 3.0                    // softness of the shadows' edges, 0.0 is the sharpest, up to 8.0
CloudShadowsCoverage = 0.0                    // added to the clouds' coverage: up to 1.0 more of the ground falls in cloud shadow, down to -1.0 less; Ctrl+Shift+F10 reads these settings again in game and adds the game's cloud values to GTAIV.EFLC.FusionFix.PostFx.log next to the plugin
CloudShadowsDebug = 0                         // 1 puts the whole ground in cloud shadow, CloudShadows of the sun taken away everywhere, to check the shadows work at all; 2 shades the ground by the raw cloud noise twenty times finer, blotches a few dozen metres across everywhere, to check the noise reaches them
SkyHDR = 1                                    // the sky goes past the game's brightness clamp without the volumetric fog too, so the sun and the bright sky around it bloom; 0 clamps it as the game does unless the fog is on
VolumetricClouds = 1                          // 3D clouds over the sky, lit by the sun in the colours of the game's clouds; while on, the cloud shadows fall under these clouds; 0 keeps only the game's flat clouds
VolumetricCloudsCoverage = 0.4                // share of the sky the clouds cover, 0.0 to 1.0, with VolumetricCloudsWeather 0; otherwise the weather sets it
VolumetricCloudsBase = 800.0                  // metres up the bottom of the clouds, with VolumetricCloudsWeather 0
VolumetricCloudsThickness = 600.0             // metres from their bottom to their top, with VolumetricCloudsWeather 0
VolumetricCloudsDensity = 0.03                // how dense and dark the clouds are; the weather scales it, thicker in rain and storms
VolumetricCloudsDetail = 0.6                  // how much the billows eat into the clouds, breaking them into ragged pieces with gaps and fraying their edges; the weather scales it, less in cloudy and wet weather; 0.0 smooth
VolumetricCloudsDetailScale = 1300.0          // metres the billow pattern takes before it repeats; its billows are a sixteenth to a quarter of it
VolumetricCloudsHaze = 25000.0                // metres over which distant clouds fade into the sky
VolumetricCloudsMaxDistance = 40000.0         // metres the clouds reach from the camera
VolumetricCloudsBrightness = 1.0              // brightness against the game's cloud colours
VolumetricCloudsSunTint = 0.6                 // how much the sides the sun lights take its colour: warm in the evening, orange at sunset; 0.0 leaves them the game's cloud colour
VolumetricCloudsMoonlight = 0.2              // how brightly the moon lights the clouds once the sun is down, against the sun; 0.0 leaves them unlit at night
VolumetricCloudsSkyLight = 0.5               // how much the clouds' shaded side and bases take the colour of the sky above them, bluish by day; 0.0 the game's grey cloud colour
VolumetricCloudsMinLight = 0.25              // the least of the sun's light any part of a cloud keeps, however deep in its shadow: higher gives lighter, airier bases and shaded sides, 0.0 as dark as the light gives
VolumetricCloudsSkyMatch = 2.0              // how many times brighter than the sky (its mean away from the sun this frame) the clouds' sunlit side is; lower keeps more of their shading out of white, 0.0 leaves them at the game's cloud colour
VolumetricCloudsWeather = 1                   // the clouds follow the weather and change with it: scattered ragged heaps with bright rims when it is fair, a low closed deck with dark bases in rain and storms; the weather also scales the absorption, translucency and detail below; 0 takes the coverage, base and thickness above
VolumetricCloudsVanilla = 0.0                 // how much of the game's own flat clouds still shows under the volumetric ones, 0.0 to 1.0; its high thin layer always stays
VolumetricCloudsTranslucency = 0.25           // how much more thin cloud and the wisps at the edges let through of the sky behind them, 0.0 to 0.9
VolumetricCloudsEvolution = 1.0               // how fast the clouds change shape as they drift: the heaps slowly reshape and their billows turn over; 0.0 still
VolumetricCloudsSaturation = 1.0              // colour saturation of the clouds against the game's cloud colours, 0.0 grey
VolumetricCloudsMottle = 0.4                  // light and dark flecks over the clouds' bodies, the small billows of their surface catching more or less light, so the grey is not even; 0.0 smooth
VolumetricCloudsShade = 0.65                  // brightness of the clouds' shaded side and bases against the game's cloud colour; lower is darker bellies
VolumetricCloudsAbsorption = 0.35             // how much the clouds swallow the sun's light inside them: higher gives darker bases and brighter edges against them
VolumetricCloudsDebug = 0                     // 2 the clouds grey at the sky brightness they are matched to; 3 to 11 one term of their light alone: 3 shade and sun, 4 silver lining, 5 sunset colour, 6 glow, 7 sun power, 8 tops, 9 rim against the sun, 10 haze, in colours (blue under 0.15, green to 0.3, yellow to 0.5, orange to 0.7, red above): 11 the share of the sun reaching inside, 12 the cloud found towards the sun in layer thicknesses, 13 the extinction per metre times 10, 14 the absorption; 15 as 11 with the sun straight overhead
VolumetricCloudsReflections = 1               // the volumetric clouds in the water's reflection too; 0 leaves it the game's sky
VolumetricCloudsReflectionBrightness = 1.0    // their brightness in the reflection against the game's reflected sky
LocalContactShadows = 1                       // short screen space shadows from street lights and headlights too, including lights the game gives no shadow map; follows the Contact Shadows menu toggle, and only with Extra Night Shadows at its last setting, with vehicle night shadows
LocalContactShadowsLength = 0.5               // world units a ray travels towards the light; longer rays show more screen space artefacts: shadows that change with the camera or vanish behind a ped
LocalContactShadowsThickness = 0.2            // how deep behind a surface still blocks the light
LocalContactShadowsMaxDistance = 40.0         // only within this distance from the camera, the cost grows with every light on screen
LocalContactShadowsIntensity = 1.0            // 1.0 removes all of the light at a shadowed pixel
VolumetricLight = 1                           // also Volumetric Light in the graphics menu: light shafts under street lights and headlights, the engine's own, as the snow season has them
VolumetricLightIntensity = 4.0                // shaft brightness
VolumetricLightScale = 0.25                   // shaft size: longer and wider as it grows; the snow season uses 0.1 in clear weather up to 0.4 in fog
VolumetricLightMaxDistance = 100.0            // shafts fade out towards this distance from the camera
VolumetricLightHeadlightFlag = 256           // light flag taken for headlights (the vehicle beam bit), 0 leaves them without shafts
VolumetricLightHeadlightIntensity = 2.0       // headlight shaft brightness
VolumetricLightHeadlightLength = 25.0         // headlight shaft size in metres, the same for low and high beams; the shaft shows over about 3/4 of it
VolumetricLightHeadlightAddFlags = 0          // extra light flags headlights get along with the shaft
VolumetricLightHeadlightShadow = 0            // 1 draws headlight shafts with the headlight's shadow, which hides them
VolumetricLightHeadlightPitch = 6.0           // degrees headlight shafts are tilted down, as their round cone aimed level rises high above the road; the headlights' own light keeps its aim
FillLights = 0                                // 1 keeps the large exterior map lights that flood squares and building fronts | 0 darkens them
FillLightsMinRadius = 30.0                    // lights reaching at least this far count as fill lights; street lights reach 8 to 20
AmbientOcclusionBlurPasses = 1
AmbientOcclusionSamples = 9
AmbientOcclusionLogMaxOffset = 3
AmbientOcclusionMaxMipLevel = 5
AmbientOcclusionFarClip = 150.0
AmbientOcclusionRadius = 1.125
AmbientOcclusionBias = 0.03
AmbientOcclusionIntensity = 0.4
AmbientOcclusionBlurRadius = 2.0
AmbientOcclusionGTAOSlices = 3                // directions around each pixel GTAO looks for horizons in, the main cost knob with Steps; read at startup
AmbientOcclusionGTAOSteps = 4                 // samples per direction and side; read at startup
AmbientOcclusionGTAOStrength = 1.0            // 1.0 as computed, higher darkens occluded places more, lower less; AmbientOcclusionRadius sets how far occluders count
AmbientOcclusionGTAOTemporal = 0.9            // share of the last frames' GTAO kept each frame; the slices turn every frame and the accumulation averages them, smoother and more exact; 0.0 turns it off; read at startup
AmbientOcclusionGTAOThinOccluders = 0.5       // 0.0-1.0: poles, railings and branches darken what is behind and around them less, as GTAO otherwise takes them for walls
AmbientOcclusionGTAOMultiBounce = 1           // 1: light surfaces darken less in their corners, as they bounce light into them | 0: occlusion alone

[TEMPORAL]                                    // TAA, DLAA and FSR (Antialiasing option in the graphics menu)
JitterPhases = 8                              // Length of the sub-pixel camera jitter sequence, DLAA uses at least 32 and FSR at least 16. [2; 128]
CurrentFrameWeightMin = 0.08                  // Weight of the current frame when the image is still, lower is smoother and more stable. [0.01; 1.0]
CurrentFrameWeightMax = 0.2                   // Weight of the current frame in fast motion, higher reduces ghosting. [0.01; 1.0]
CurrentFrameWeightPerPixelOfMotion = 0.1      // How quickly the weight goes from min to max as motion increases
VarianceClipGamma = 1.25                      // History rejection, lower reduces ghosting, higher reduces flickering. [0.5; 4.0]
LumaWeight = 1.0                              // Reduces flickering of very bright pixels. [0.0; 16.0]
ObjectMotionVectors = 1                       // Motion vectors for moving peds, vehicles and objects
SkinnedMotionVectors = 1                      // Motion vectors for animated limbs of peds
ObjectDepthBias = 0.00002                     // Depth tolerance when drawing object motion vectors
CameraCutDistance = 25.0                      // Camera movement in one frame, in meters, that resets the history
DLSSPreset = 0                                // DLAA model: 0 default, 10 J, 11 K, 12 L, 13 M. Needs nvngx_dlss.dll in the game or plugins folder
FSRSharpness = 0.0                            // FSR sharpening. Needs amd_fidelityfx_loader_dx12.dll and amd_fidelityfx_upscaler_dx12.dll in the game or plugins folder. [0.0; 1.0]
UpscalerQuality = 0                           // also Upscaler Quality in the graphics menu, with DLAA or FSR: the scene renders below the screen size and is upscaled | 0: native (DLAA) | 1: quality, 67% | 2: balanced, 58% | 3: performance, 50% | 4: ultra performance, 33%
ReactiveMask = 1                              // TAA and FSR: particles and glass follow the current frame more, which reduces ghosting on them
ReactiveMaskScale = 2.0                       // How strongly a difference caused by transparent geometry counts. [0.0; 64.0]
ReactiveMaskMaximum = 0.75                    // Highest weight of the current frame the mask can give. [0.0; 1.0]
RainAfterAntialiasing = 1                     // TAA, DLAA and FSR: the rain is drawn into a layer of its own and added to the picture after them, so its streaks, which have no motion vectors, are not smeared
SteadyDepth = 1                               // TAA, DLAA and FSR: depth of field, sun shafts and the coronas read a depth averaged over the camera jitter, so their edges and partly hidden coronas do not flicker
FrameGenerationDelay = 0.5                    // Frame Generation (graphics menu, with DLAA or FSR): time between a generated frame and the rendered one, as a part of the frame time. [0.0; 1.0]. The FrameGeneration keys are read again when this file is saved
FrameGenerationPacing = 2                     // Where in the next frame the rendered frame goes | 0: by the time on the CPU | 1: by the draw calls | 2: by GPU timestamps, so that the screen gets the frames evenly
FrameGenerationDebug = 0                      // Checks of the frame generation, bits to add | 1: a square in the top left corner, magenta on generated frames and green on rendered ones, which flickers when both reach the screen | 2: logs how far between its neighbours a generated frame is (reads frames back, slow) | 4: only the generated frames are shown | 8: logs the pacing every 300 frames

[HDR]                                         // HDR output (Display menu). Needs the Vulkan graphics API and Windows HDR, borderless windowed is recommended
RollOffStart = 0.8                            // Fraction of the peak brightness where highlights start to roll off instead of clipping. [0.0; 1.0]

[TEXTURES]
Sharpening = 0                                // also Sharpening (CAS) in the graphics menu: AMD's contrast adaptive sharpening of the finished frame, after anti-aliasing and before the HUD | 0: off | 1: low | 2: medium | 3: high
TextureLodBias = 0                            // also Texture LOD Bias in the graphics menu: textures of surfaces switch to their smaller mip maps later with distance, so they stay sharper but shimmer more | 0: off | 1: -0.25 | 2: -0.5 | 3: -0.75 | 4: -1.0
AnisotropicAllMaps = 0                        // also Anisotropic: All Maps in the graphics menu: the normal and specular maps the game filters bilinearly get the anisotropic filtering its own menu sets for the other textures, so bumps and highlights on surfaces seen at an angle stay as sharp as their colour
DetailTextures = 0                            // also Detail Textures in the graphics menu: a fine grain of light, shade and bumps on walls, roads and ground up close, where their textures turn to blur; it fades out with distance
DetailTexturesTiling = 8.0                    // how many times the grain repeats across one repeat of a surface's texture, higher is finer
DetailTexturesAlbedo = 0.15                   // how much the grain lightens and darkens the colour, 0.0 leaves it alone
DetailTexturesNormal = 0.5                    // how strong the grain's bumps are, 0.0 leaves the surface flat
BicubicFiltering = 0                          // also Bicubic Filtering in the graphics menu: textures seen so close that a texel covers more than a pixel are filtered bicubically (Catmull-Rom), sharper than bilinear filtering and without the diamond pattern it shows
SpecularAntiAliasing = 0                      // also Specular Anti-Aliasing in the graphics menu: where the normal turns within a pixel, as on bumpy surfaces at a distance, the highlight is widened and dimmed to what the pixel covers instead of sparkling
SpecularAntiAliasingStrength = 1.0            // how much the normal's variation widens the highlight
SpecularAntiAliasingMax = 0.18                // how far a highlight can be widened at most, as roughness squared
GroundSurfaces = 1                            // also Ground Surfaces in the graphics menu: the ground's texture layers blend by their height, their repeat is broken up, they get wide patches of colour and bumps from their own light and shade; bricks and cobbles with a height map get parallax occlusion mapping
GroundHeightBlend = 1.0                       // how much the ground's layers blend by their height, so grass shows first in the gaps between stones, 0.0 keeps the game's soft blend
GroundHeightBlendDepth = 0.2                  // how soft the height blend's edge is, lower is sharper
GroundAntiTiling = 1.0                        // how much of the ground's texture is read a second time, shifted, so its repeat shows less, 0.0 leaves it alone
GroundAntiTilingSize = 4.0                    // about how many metres across the patches of that second read are
GroundAntiTilingSharpness = 16                // how sharp the edges of those patches are; low values blend the two reads into a softer, paler mix
GroundColorVariation = 0.25                   // how much wide patches lighten and darken the ground, a little warmer where lighter, as a fraction of its colour; 0.0 leaves it alone
GroundColorVariationSize = 15.0               // about how many metres across those patches are
GroundBumps = 0.08                            // how high in metres the ground's bumps from its texture's light and shade are, 0.0 leaves it flat
GroundBumpsCoarse = 0.25                      // how high in metres the larger lumps are, from the texture's light and shade averaged over a few texels, so the ground reads as uneven and not only grainy
GroundDetailBumps = 0.005                     // how high in metres the bumps of the Detail Textures grain are on the ground, when those are on
GroundBumpsFadeStart = 15.0                   // metres from the camera where the ground's bumps start to fade
GroundBumpsFadeEnd = 60.0                     // metres from the camera where they are gone
GroundCavity = 2.0                            // how much the hollows of ground facing up (where its texture is darker than around) shade the sky's light and reflections in them, 0.0 leaves them alone
GroundCavityAlbedo = 0.3                      // how much of that shade the ground's colour takes as well, so the hollows show in sunlight too
GroundParallaxDepth = 0.05                    // how deep in metres the parallax occlusion mapping of natural ground facing up with no normal map (grass, earth, gravel) is, its brightness taken as its height; 0.0 turns it off
GroundParallaxContrast = 3.0                  // how much the brightness, against the texture's average, raises the ground in that parallax; higher makes more of it stand out at full height
GroundSelfShadow = 0.5                        // how dark that parallax's bumps make the ground behind them from the sun or the moon, on its colour; 0.0 turns it off
GroundSelfShadowSharpness = 4.0               // how sharply that shade comes in, higher is harder
GroundParallaxFadeStart = 10.0                // metres from the camera where the parallax starts to fade; further on its steps grow coarse against the texture and shimmer
GroundParallaxFadeEnd = 30.0                  // metres from the camera where it is gone
ParallaxOcclusionMinSteps = 8                 // steps of parallax occlusion mapping on a surface seen from straight above
ParallaxOcclusionMaxSteps = 32                // steps on a surface seen along it, at most 32
ParallaxOcclusionDepth = 1.0                  // how deep the parallax looks next to the game's own
GroundSurfacesDebug = 0                       // 1: with Ground Surfaces on, the terrain shaders draw half magenta, the parallax ones half cyan, and other ground facing up orange, the more so where its texture counts as natural (gets the second read), and Ctrl+Shift+F10 writes how often each is used to GTAIV.EFLC.FusionFix.Ground.log

[SHADOWFILTERSHARP]                           // CE-like shadows
ShadowSoftness = 1.5                          // controls shadow blur
ShadowBias = 5.0                              // controls shadow bias, adjust according to softness

[SHADOWFILTERSOFT]                            // 1.0.4.0-like shadows
ShadowSoftness = 3.0                          // controls shadow blur
ShadowBias = 8.0                              // controls shadow bias, adjust according to softness

[SHADOWFILTERCHSS]                            // CHSS / PCSS
ShadowSoftness = 1.5                          // controls minimum shadow blur
ShadowBias = 5.0                              // controls shadow bias, adjust according to minimum softness
MaxSoftness = 20.0                            // controls maximum shadow blur

[PROJECT2DFX]
CoronaRadiusMultiplier = 1.0                  // multiplier for corona radius
CoronaAlphaMultiplier = 1.0                   // multiplier for corona alpha
SlightlyIncreaseRadiusWithDistance = 1        // slight increase in corona radius with distance
DisableDefaultLodLights = 1                   // disable default distant lights

[TURNINDICATORS]
ManualTurnIndicators = 0                      // enable manual turn indicators, tap LB or RB on gamepad to activate
LeftIndicatorKey = 0xDB                       // VK_OEM_4, the Left Brace key
RightIndicatorKey = 0xDD                      // VK_OEM_6, the Right Brace key

[EXPERIMENTAL]
DisplayMemoryStats = 0                        // while the FPS Counter is enabled, it prints some memory counters alongside, like for used streaming memory and memory used by the entire process
ReflectionMSAAQuality = 0                     // Applies MSAA to the reflection maps (exterior, interior, water, mirror) like on Xbox 360. Valid options: 2|4|8, other values are ignored and disable this feature.
