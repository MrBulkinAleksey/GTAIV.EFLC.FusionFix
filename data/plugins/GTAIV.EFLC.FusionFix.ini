// Fusion Fix. This file holds switches and modes only; what the graphics menu sets is kept here by the game itself.
// Every other value has its default in the code and can be added under its section when needed (the key names are in the code).
// Ctrl+Shift+F10 reads the file again in game; what sizes buffers or patches the game at startup takes a restart.

[MAIN]
RecoilFix = 1                                 // make recoil behavior the same as controller when playing with keyboard and mouse
AimingZoomFix = 1                             // -1: TBoGT aiming zoom behaves like IV and TLaD | 0: disable the fix | 1: TBoGT aiming zoom behaves like xbox feature | 2: have this feature also enabled in IV and TLaD

[CAMERASENSITIVITY]
MouseLookSensitivityRange = 0.1, 2.0          // min and max range for mouse look sensitivity slider
GamepadLookSensitivityRange = 0.1, 2.0        // min and max range for gamepad look sensitivity slider
MouseAimSensitivityRange = 0.1, 2.0           // min and max range for mouse aim sensitivity slider
GamepadAimSensitivityRange = 0.1, 2.0         // min and max range for gamepad aim sensitivity slider

[MISC]
DefaultCameraAngleInTLaD = 1                  // enforces the default IV camera angle on bikes in TLaD
PedDeathAnimFixFromTBoGT = 1                  // disables the additional death animation performed after counter attacking peds in IV and TLaD, like in TBoGT
DisableCameraCenteringInCover = 1             // disables the forced camera centering after moving to the edge of a wall while in cover
FirstPersonOnFoot = 1                         // the change camera control goes on from the farthest view on foot to first person (restart)
FirstPersonInVehicle = 1                      // the change camera control goes on from the hood view in a vehicle to first person (restart)
ExtraInfo = 1                                 // shows extra info in the pause menu (e.g. loaded img files amount)
OverrideTreeAlpha = 0.0                       // set to e.g. 0.625, 2.5 or 4.0 for PC, PS3 or X360 tree alpha, respectively
ConsoleCarReflectionsAndDirt = 1              // use stronger console car reflections and any cars can be dirty when they are spawned like console
BrakeLightsWhenStopped = 0                    // lights the players brake lamps while stopped, like AI vehicles do (vanilla only lights them above walking pace)
FixHelicopterSearchlights = 1                 // 0: disabled, searchlights may flicker/fight each other | 1: only one searchlight can be active at a time (for max 10s) | 2: all searchlights can draw independently
AlwaysDisplayHealthOnReticle = 1              // allow game to display NPC health on the reticle when playing with keyboard and mouse
SmoothShorelines = 1                          // makes water edges smooth and adjusts foam noise
SmoothLightVolumes = 1                        // makes light volume edges smooth
NoBloomColorShift = 1                         // prevents bloom threshold from causing wild color shifts when tone mapping is enabled
MenuEnteringDelay = 0                         // 400:  default | 0: no delay
MenuExitingDelay = 0                          // 800:  default | 0: no delay
MenuAccessDelayOnStartup = 0                  // 3000: default | 0: no delay
RadarZoomDelay = 3000                         // 0:    default | 3000: 3s delay
DeathMusic = 0                                // plays cut death music when player is dead in IV
AutoClimbLaddersRange = 1.5                   // how close you must be to auto-climb, in units (the game uses 4.0 for a manual button press)
PlayerJumpRagdollControl = 0                  // allows triggering a ragdoll on demand by pressing the reload key while jumping, like in GTAV
PlayerClimbRagdollControl = 0                 // also allows triggering a ragdoll on demand by pressing the reload key while climbing

[TURNINDICATORS]
ManualTurnIndicators = 0                      // enable manual turn indicators, tap LB or RB on gamepad to activate
LeftIndicatorKey = 0xDB                       // VK_OEM_4, the Left Brace key
RightIndicatorKey = 0xDD                      // VK_OEM_6, the Right Brace key

[EPISODICCONTENT]
EpisodicVehicles = 0                          // Support for APC, Buzzard, smuggler, floater, blade and all their abilities in IV and TLaD
EpisodicWeapons = 0                           // Support for DSR1, Grenade launcher, Pipe bomb, Sticky bomb, AA12 explosive shells, P90 vehicle check, Parachute and all their abilities in IV, TLaD and TBoGT
ExplosiveAnnihilator = 0                      // Enables explosive rounds on Annihilator in IV, requires ep weapons
OtherEpisodicChecks = 0                       // Support for Disco camera bobbing, Cell Phone switching, Altimeter in helicopters and parachute, Explosive sniper and fists cheat in IV and TLaD, requires related ep files
TBoGTHelicopterHeightLimit = 0                // Raises IV and TLaD height limit for helicopters to TBoGT level
TBoGTPoliceWeapons = 0                        // Gives P90 and AA12 to SWAT and FIB and M249 to police in helicopters in IV and TLaD. Requires ep weapons
RemoveSCOSignatureCheck = 0                   // Allows using any episodic SCO on all episodes
EpisodicDeathMusic = 0                        // Allows the restored death music to play in all episodes. Requires custom sound files added per-each episode for it to be unique.

[BudgetedIV]
VehicleBudget = 0                             // used to avoid "Taxi Bug", may cause vehicle audio issue
PedBudget = 0                                 // may cause issues
ExtendedLimits = 1                            // increases various limits like modelinfo, handling, carcols, some pools size

[FRAMELIMIT]
FrameLimitType = 2                            // 1: realtime (thread-lock)  |  2: accurate (sleep-yield), uses less resources
FpsLimit = -2                                 // used when FPS Limit menu toggle is set to Custom (negative values use refresh rate as a base)
CutsceneFpsLimit = 0                          // custom FPS Limit value in cutscene
LoadingFpsLimit = 30                          // used to avoid game freeze on loading (e.g. Off Route mission)
UnlockFramerateDuringLoadscreens = 1          // game loads faster when using frame limiter
MinigamesFpsLimit = 30                        // used to avoid possible issues for specified minigames in MinigamesList
MinigamesList =                               pool_game, air_hockey, arm_wrestling, tenpinbowl, drinking

[PERFORMANCE]                                 // trades of a little quality or a rare case for GPU or CPU time
SunShadowsAtNight = 1                         // 1: the sun's cascaded shadows are drawn at night too | 0: not from 22:00 to 05:00, which saves some 7 ms a frame at night
FarCascadesHalfRate = 1                       // the two far sun shadow cascades take turns, one drawn a frame, while the camera keeps still | 0: every frame
MidCascadeHalfRate = 0                        // the second cascade (10 to 30 m out) takes turns too; passing cars may show their shadows a frame late | 0: every frame
UnpinMainThread = 1                           // the main game thread may run on any CPU core, not only the first one the game pins it to (restart)
ReflectionsHalfRate = 1                       // the water's reflection and the cars' reflection map are drawn every other frame while the camera hardly moves | 0: every frame
WaterReflectionWhenSeen = 1                   // the water's reflection is not drawn while no water was seen on screen a frame or two before (the game draws it with water behind the houses too) | 0: whenever the game draws it
WaterFarLayer = 1                             // the far part of the water's reflection (past 400 m: most of a river's city) is drawn only now and then (every 2 s, or once the camera moved 10 m or turned 2 degrees) into a layer of its own and laid in from it every frame; turning, its edge shows sky until the next | 0: all of it every time
ContactShadowsHalfResolution = 1              // contact shadows are worked out at half size, about a quarter of the cost | 0: full size (restart)
CloudReflectionsAtNight = 0                   // 1: volumetric clouds in reflections at night too, when they show nothing | 0: the game's sky then, some 2.5 ms saved
CloudReflectionsHalfResolution = 1            // the clouds in reflections are worked out at half size | 0: at the reflection's size
CloudsHalfResolution = 1                      // the volumetric clouds are worked out at half size and built up over frames | 0: full size, sharper, about four times their cost (restart)
AmbientOcclusionHalfResolution = 1            // ambient occlusion is worked out at half size, about half its cost | 0: full size (restart)
LampShadowFaceCulling = 1                     // lamps' dual paraboloid shadow maps get each building, prop and vehicle only in the half that faces it, some 40% fewer draws there | 0: both halves get them
LampShadowRangeCulling = 1                    // lamps' shadow maps leave out buildings, props and vehicles wholly beyond the lamp's light, which cannot shadow anything it lights | 0: all the game sends
LampShadowSmallCull = 1                       // lamps' shadow maps leave out props under 2% of their distance from the lamp (a 0.4 m can 20 m off), whose shadow is a few blurred texels | 0: all drawn
LampShadowConeCulling = 1                     // spot lamps' shadow maps leave out buildings, props and vehicles wholly outside the lamp's cone, which it does not light | 0: all the game sends
LampShadowViewCulling = 1                     // lamps' shadow maps leave out buildings, props and vehicles that cannot shadow anything the camera sees (outside the hull of the view and the lamp) | 0: all the game sends
HeavyPropCull = 1                             // small objects made of many parts (benches, posts, stands: 8+ draws each) leave the sun's shadows past 40 m and thin out past 80 m, none past 100x their radius: up to 2 ms of CPU | 0: all drawn
FarPropInstancing = 2                         // grass, weeds, small plants and the ground's litter, rocks and rubble past 30 m are drawn with one instanced draw per model instead of one each, and no longer thin out past 60 m | 1: plants only | 0: one draw each, thinned
FarFadeCull = 1                               // small buildings and props (lamp posts, traffic lights, plants) the game is fading out far off leave somewhere in the faint half of their fade instead of at its end, each at its own point: Detail Quality draws them 100+ m past their own reach as a faint stipple at a full draw's price | 0: to the end of the fade
SkipLeftOutDraws = 1                          // the passes left out above (reflections and far cascades taking turns, the night's cascades) skip the game's CPU work for their objects too | 0: only their GPU draws go
HiZOcclusion = 1                              // occlusion culling: buildings, props, cars and people hidden behind the depth drawn, two frames running, are left out of the scene (their shadows and reflections stay); log in GTAIV.EFLC.FusionFix.Occlusion.log | 2: tested and counted only | 0: off; not 0 at the start, it changes on the fly
HiZOcclusionBoxes = 1                         // buildings are tested by their model's box as they stand, cars, people and objects by their sphere | 0: all by the sphere
LampShadowsOcclusion = 1                      // a lamp or headlight whose whole reach is hidden behind buildings draws no shadow map, its slot goes to a light in view | 0: off
CoronasOcclusion = 1                          // lamp coronas and distant lights hidden behind buildings get no quad (they were invisible already, only CPU work goes); log in GTAIV.EFLC.FusionFix.Occlusion.log | 2: counted only | 0: off

[ANTIALIASING]                                // TAA, DLAA, FSR and frame generation (Antialiasing, Upscaler Quality and Frame Generation in the graphics menu)
ObjectMotionVectors = 1                       // motion vectors for moving peds, vehicles and objects
SkinnedMotionVectors = 1                      // motion vectors for the animated limbs of peds (restart)
DLSSPreset = 0                                // DLAA model: 0 default | 10 J | 11 K | 12 L | 13 M (needs nvngx_dlss.dll in the game or plugins folder)
ReactiveMask = 1                              // TAA and FSR: particles and glass follow the current frame more, less ghosting on them (restart)
RainAfterAntialiasing = 1                     // the rain is added after TAA, DLAA and FSR, so its streaks are not smeared
SteadyDepth = 1                               // depth of field, sun shafts and coronas read a depth steadied over the jitter, so their edges do not flicker (restart)
FrameGenerationPacing = 2                     // where in the next frame the rendered frame goes | 0: by the CPU's clock | 1: by the draw calls | 2: by GPU timestamps
FrameGenerationDeferred = 1                   // 1: the generated frame is made while the next one renders, the GPU does not wait for it | 0: the game's Present shows it
FrameGenerationAsyncCompute = 1               // 1: frame generation runs on a compute queue beside the game's next frame | 0: after the game's work
HelperPresent = 1                             // with DLAA or FSR the helper shows the frames, the generated ones too (windowed or borderless, not under Wine) | 1: frame generation paced by AMD's swap chain | 2: by the helper's own (FrameGenerationDelay)

[SHADOWS]
ExtraDynamicShadows = 2                       // adds back some missing shadows | 1: to some vegetation | 2: to some fences, grates, roads, walls and some vegetation
CascadeBlendSize = 0.1                        // controls the size of the cascade blending region | [0.0; 1.0]
HighResolutionShadows = 0                     // doubles cascaded shadow map resolution, very GPU intensive
ForceShadowFilter = 0                         // 0: blur quality tied to definition | 1: always use low quality | 2: always use high quality

[SHADOWFILTERSHARP]                           // CE-like shadows
ShadowSoftness = 1.5                          // controls shadow blur
ShadowBias = 5.0                              // controls shadow bias, adjust according to softness

[SHADOWFILTERSOFT]                            // 1.0.4.0-like shadows
ShadowSoftness = 3.0                          // controls shadow blur
ShadowBias = 8.0                              // controls shadow bias, adjust according to softness

[SHADOWFILTERCHSS]                            // CHSS / PCSS
ShadowSoftness = 1.5                          // controls minimum shadow blur
ShadowBias = 5.0                              // controls shadow bias, adjust according to minimum softness
MaxSoftness = 20.0                            // controls maximum shadow blur

[NIGHTSHADOWS]                                // shadows of street lamps, headlights and other lights at night (Extra Night Shadows in the graphics menu)
LampShadowsInDaylight = 0                     // 1: lamps cast shadows whenever the game lights them | 0: not while the sun's shadows are drawn outside
SlotAllocation = 2                            // who gets the seven night shadow slots | 0: the game | 1: worked out and logged, not used | 2: Fusion Fix, with slots kept for the player (restart)
CameraAwarePriority = 1                       // lights whose light reaches the view come first (restart)
LampViewPriority = 1                          // lamps whose light reaches the view come first, keeping the game's own choices and shadow caches
LampShadowAxis = 0                            // which way a lamp's two-half shadow map looks; where its halves' rims are, shadows come out fat and bent | 0: the game's, every map split across world x | 1: down for lamps, along the beam for spots (walls beside a lamp on the rims) | 2: lamps level toward you (down when you are under one), spots along the beam: you, your car, its shadow and the street toward you near a half's centre
LampShadowPlaneDepth = 1                      // a lamp's shadow map takes each texel's depth on the drawn surface along its own ray, not between the corners of a big triangle, which bent walls and awnings near a lamp (a wall shadowing itself, holes in an awning's shadow, a tunnel road's curved bands); any LampShadowAxis
LampShadowRetention = 1                       // a far lamp at the edge of its shadow's reach keeps the shadow a moment longer, so it does not flicker on and off (Liberty's Shadows 2.0.4) (restart)
LampShadowFade = 1                            // a far lamp's shadow fades out over the last part of its reach instead of going at once (Liberty's Shadows 2.0.4) (restart)
IndoorShadowBubble = 1                        // on foot, the lamps of the room around you within 10 m keep their shadows however small they look (Liberty's Shadows 2.0.4) (restart)
InteriorLightsFirst = 1                       // on foot inside, the lamps of the interior you are in take the night shadow slots before the lights outside (Liberty's Shadows 2.1.0)
VisibleReceiverRanking = 1                    // a lamp whose light reaches the view ranks up to 1.15 times nearer in the game's own sort, the more the nearer the middle of the frame (Liberty's Shadows 2.0.1)
LampCacheViewPriority = 1                     // the eight cached lamp shadows go first to lamps you look at, not to the nearest ones behind you: lamps down the street have their shadows before you come near
CasterAwarePriority = 1                       // the slots go first to lights with a car or ped you look at in their light; while driving, the lamps ahead
LampsBehindWalls = 1                          // a lamp without a cached shadow behind a wall (the next tunnel) gives its slot to lamps you can see (restart)
OwnHeadlightCasterFix = 1                     // your car and the people in it cast no shadow from its own headlights (restart)
CloseHeadlightRelevance = 1                   // headlights shining right at you count when the slots are given out
TrafficSelfShadowFix = 1                      // oncoming traffic casts no shadow from its own headlights while you are on foot
PostShadowsFromCarLights = 0                  // street and park lamp posts cast shadows in the light of car headlights and rear lamps (restart)
NearbyVehicleReceivers = 1                    // on foot, headlights lighting a car near you cast shadows even when you are outside the beam
TrafficSignalShadows = 2                      // traffic signals nearest you that cast shadows, sharing the seven slots | 0: none | up to 7 (restart)
AddedLightsLast = 1                           // traffic signals and building lights (windows, shop fronts, neon) take a shadow slot only when no other light wants it; meanwhile cars, people and props under them cast box and capsule shadows
EmergencyLightShadows = 1                     // the flashing lights of up to two emergency vehicles within 30 m cast shadows (restart)
WorldLightShadows = 1                         // lights of the world get shadows the game gives them none of: lamps shadowed from their cache alone race for slots too (CachedLampShadows), lights of models (ModelLightShadows), coronas (CoronaLightShadows); each more light racing for the seven slots and the caches (restart)
CachedLampShadows = 1                         // with Building Light Shadows: lamps the game shadows from its cache compete for slots too | 0: they keep their cached shadow (restart)
ModelLightShadows = 3                         // with Building Light Shadows: lights of models made without shadows get them | 1: all of them | 2: buildings' only (shop fronts, signs on a facade) | 3: objects' only (scaffold and tunnel ceiling lights, wall lamps) | 0: none; each more light racing for the slots and caches (restart)
ModelLightShadowsNeedCasters = 1              // such a light competes for a slot only with a car or ped in its light | 0: always (restart)
ModelLightCacheDistance = 15                  // such a light within this many metres of you also gets a cached map, baked from cube faces, whose edges stay straight (an awning under a shop front's light no longer shadows with a round hole); cars and peds still draw over it | 0: never (restart)
LampCacheBudget = 12                          // lights that cast a shadow without a cached map of their own (the game's lamps with a dynamic shadow only, tunnel and room lamps, model lights): the nearest this many within the lamp shadow reach get one, baked from cube faces, the ones you look at first; their slot then draws only cars and peds over it | 0: only model lights within ModelLightCacheDistance (restart)
LampShadowCaches = 32                         // cached lamp shadow maps (static world and props, a lamp keeps its shadow without a slot) | 8: the game's | 16: the shadow atlas 5 x 5 maps instead of 4 x 4 | 32: in the same atlas, 12 whole maps and 20 at half size for far lamps (restart)
CacheWholeTileDistance = 25                   // with 32 caches: a lamp nearer than this many metres (behind the camera counting three times as far) takes a whole map, a farther one a half-size one (restart)
CacheEvictMargin = 1.25                       // with 32 caches: a lamp's cache goes to another lamp only when it is this many times as far (plus 2 m), so lamps at about the same distance stop handing caches back and forth (restart)
PropsInLampCaches = 1                         // a cached lamp shadow map holds the props the lamp lights (scaffolds, awnings, bins), so their shadows stay while the lamp has no slot; they take no capsule or box shadow from it then (restart)
LampsSkipOwnObject = 1                        // a light of an object (a scaffold's ceiling light, a lamp post's head) leaves that object out of its own shadow map: a light hanging inside its object went dark below whenever it took a slot | 0: drawn (restart)
CoronaLightShadows = 1                        // with Building Light Shadows: a lamp that is only a glow lights its surroundings, with a shadow, in its colour (restart)
CoronaLightApproximation = 1                  // 1: a glow without an authored range and intensity gets them from its size | 0: no light for it (restart)
StableMapSlots = 1                            // a light keeps its place in the shadow atlas while it keeps its slot | 0: the game renumbers them every frame (restart)
SharedMaps = 1                                // two lights written at the same place share one shadow map | 0: a slot each (restart)
VehicleBoxShadowsBlend = 1                    // box shadows, shadow maps and contact shadows take the darkest of them, not their product
VehicleBoxShadowsFromCarLights = 0            // headlights and other car lights shadow nearby cars as boxes too
VehicleBoxShadowsUntilLeaving = 1             // a car keeps the shadow it got from a lamp, the map's or the box, until it leaves the lamp | 0: they swap as the lamp gains and loses its slot
VehicleBoxShadowsWithSlots = 0                // 1: lamps with a slot draw the cars into their map and keep the boxes under it | 0: their map leaves the boxed cars out
VehicleBoxShadowsLive = 0                     // 1: boxes follow each car as its lights are drawn (can jerk) | 0: as handed over, moved ahead by the car's speed
PropShapeShadows = 1                          // with box shadows: lamp posts, bins, benches, containers and other props cast the shadow of a capsule or a box from the lights near them, car lights too

[HEADLIGHTS]
ConsistentBrightness = 1                      // headlights of the car you just left keep the player's brightness and range while they stay on (restart)
LightModes = 1                                // the headlight control steps through on, high beams and off (restart)
OffscreenLights = 1                           // a car's lights go out out of view where nothing else sees it, beyond 35 m | 0: as the game | 1: your car | 2: every car (restart)

[LIGHTING]                                    // contact shadows, indirect light, skin, GGX highlights, volumetric light (each also in the graphics menu)
ContactShadowsStepJitter = 1                  // contact shadow steps are offset per pixel, turning bands into fine noise | 0: the same for every pixel
ContactShadowsMoon = 1                        // the moon's contact shadows at night while the sun's cascades are off (SunShadowsAtNight 0)
SkyHDR = 1                                    // the sky passes the game's brightness clamp without the volumetric fog too, so the sun blooms | 0: as the game
LocalContactShadows = 1                       // street lights and headlights cast contact shadows too (with Contact Shadows and Extra Night Shadows at its last setting)
VolumetricLightHeadlightShadow = 0            // 1: headlight shafts take the headlight's shadow, which hides them (restart)
FillLights = 0                                // 1: the large exterior lights that flood squares and building fronts stay | 0: darkened
FarLights = 1                                 // 1: map and traffic lights shine from farther: they fade from 350 m at least, light the view from out of it within 100 m (the game 35 m), traffic signals keep their lights to 200 m (the game 80 m) (restart)

[POSTFX]
EnablePreAlphaDepth = 1                       // Properly render depth related post-processing effects (e.g depth of field, sunshafts) through windows/transparent objects
AmbientOcclusionBlurPasses = 1
AmbientOcclusionSamples = 9
AmbientOcclusionLogMaxOffset = 3
AmbientOcclusionMaxMipLevel = 5
AmbientOcclusionFarClip = 150.0
AmbientOcclusionRadius = 1.125
AmbientOcclusionBias = 0.03
AmbientOcclusionIntensity = 0.4
AmbientOcclusionBlurRadius = 2.0
AmbientOcclusionGTAOMultiBounce = 1           // 1: light surfaces darken less in their corners, as they bounce light into them | 0: occlusion alone

[SUNSHAFTS]
SunShaftsDensity = 0.9                        // How long the rays are. [0.0; 1.0]
SunShaftsDecay = 0.95                         // How fast the rays fade out from the center. [0.0; 1.0]

[FOG]
VolFogFarClip = 4500.0                        // override far clip for volumetric fog
ExtendedTimecycEditing = 0                    // 0: disabled | 1: display debug info and reload .dat with F3

[REFLECTIONS]                                 // screen space reflections (SSR in the graphics menu) and the clouds in reflections
SSRPastThinObjects = 1                        // 1: a ray passing behind a thin object such as a trunk carries on | 0: it ends as a miss
SSRStepJitter = 1                             // ray steps are offset per pixel, turning bands into fine noise | 0: the same for every pixel
SSRTemporalJitter = 1                         // the step offsets change every frame and the accumulation averages them | 0: the same every frame
SSRGBufferNormals = 1                         // 1: reflect off the normals the game stores | 0: rebuilt from depth, coarse on cars and roads
SSRCarWindows = 1                             // car windows reflect the scene around them
SSRCarWindowsStepJitter = 1                   // car window ray steps are offset per pixel | 0: the same for every pixel, edges show as slices
CloudReflections = 1                          // the volumetric clouds in the water's reflection too | 0: the game's sky there

[WEATHER]                                     // wet ground, cloud shadows, volumetric clouds and the sky (Wet Weather, Volumetric Clouds and Physical Sky in the graphics menu)
PbrSkyHorizonHue = 0                          // 1: the Physical Sky takes the timecycle's hue down to the horizon (its evening brown) | 0: near the horizon the air's own
VolumetricCloudsWeather = 1                   // the clouds follow the weather: ragged heaps when fair, a low dark deck in rain | 0: one fixed cloud layer
VolumetricCloudsPerlinWorley = 1              // the clouds' billows joined by wisps and ragged plumes (Perlin-Worley noise) | 0: round billows alone (Worley noise)

[PROCEDURAL]                                  // grass and the props the game places on its own (Grass & Props Distance in Display > Advanced, Improved Grass in Graphics > Lighting)
ProceduralGatherPriority = 1                  // with the ground triangles nearly all taken, the far ones go first, so near ground keeps its props
ProceduralInReflections = 0                   // 1: props in water reflections too, as the game has them | 0: left out
ProceduralConeRelease = 1                     // props left well behind the camera go and come back when you turn to them | 0: they stay until their ground goes
ProceduralGroundCovers = 1                    // grass that runs on under a road or a pavement grows no plants or GPU grass blades up through it (nor props on it) | 0: as the game has it
ProceduralFarThinning = 1                     // past the game's own reach props thin out with distance, each at its own reach, instead of all going as far as Grass & Props Distance takes them | 0: all go the whole way
ProceduralSmallFarCull = 1                    // props smaller than 0.5% of their distance (a weed past 180 m) are not drawn, and past 60 m small ones thin out, 60 / distance of them kept, the same ones each time: thousands of far weeds cost up to 3.5 ms of CPU | 0: all drawn to their reach
GpuGrassHideProps = 1                         // with GPU Grass on, the game's grass, weed and small plant props are not made where it grows (nor drawn), coming back as it thins out with distance | 0: both
GpuGrassClumps = 80                           // clumps of GPU grass per piece of ground (up to 1.5 square metres), 8 to 160: the cost goes with their number
GpuGrassCrossed = 0                           // 1: each clump a cross of two cards, full from every side, twice the cost of a flat one (40 crossed cost what 80 flat do) | 0: a flat card
GrassWind = 1                                 // the wind sways the grass, weeds and small plants, harder in a strong wind | 0: they stand still
GrassBending = 1                              // grass bends under feet, wheels and a helicopter's downwash | 0: it doesn't
GrassTrample = 1                              // grass walked or driven over stays down and rises again over a few seconds | 0: it rises at once
BushShake = 1                                 // bushes part away from people and cars going through them and shake while they move | 0: they don't

[PROJECT2DFX]
CoronaRadiusMultiplier = 1.0                  // multiplier for corona radius
CoronaAlphaMultiplier = 1.0                   // multiplier for corona alpha
SlightlyIncreaseRadiusWithDistance = 1        // slight increase in corona radius with distance
CoronaRenderer = 1                            // 1: Fusion Fix draws the coronas, less CPU time, skipping those out of view | 2: the same, none skipped | 0: the game draws them (restart)
DisableDefaultLodLights = 1                   // disable default distant lights

[EXPERIMENTAL]
DisplayMemoryStats = 0                        // while the FPS Counter is enabled, it prints some memory counters alongside, like for used streaming memory and memory used by the entire process
ReflectionMSAAQuality = 0                     // Applies MSAA to the reflection maps (exterior, interior, water, mirror) like on Xbox 360. Valid options: 2|4|8, other values are ignored and disable this feature.

[DEBUG]                                       // logs, traces and debug views, all off; logs go next to the plugin
CascadeMatrixTrace = 0                        // 1: 300 frames of the sun cascades' matrices to GTAIV.EFLC.FusionFix.RenderSkip.log, 20 s into the game (restart)
NightShadowsSlotLog = 0                       // 1: who takes the seven night shadow slots and why, to GTAIV.EFLC.FusionFix.NightShadows.SlotTrace.log (restart)
NightShadowsCacheLog = 0                      // 1: what the eight static lamp shadow caches do (new entries, evictions, lamps waiting for one) to GTAIV.EFLC.FusionFix.NightShadows.CacheLog.log (restart)
NightShadowsDiagnostics = 0                   // 1: night shadow diagnostics and a light trace to GTAIV.EFLC.FusionFix.NightShadows.log (restart)
NightShadowsCrashDiagnostics = 0              // 1: crash context of the night shadows to GTAIV-shadow-crash-*.bin (restart)
RenderSkipTrace = 0                           // 1: two frames of the game's passes to GTAIV.EFLC.FusionFix.RenderSkip.log, 20 s into the game (restart)
SSRDebug = 0                                  // 1 to 10: reflection colour, ray hits, normals, horizon fade, specular, glass rays, contact shadows, indirect light, skin, its history (also Graphics > Debug)
SSRMarchFullDepth = 0                         // 1: SSR marches the full size depth instead of the half size one, to compare (also Graphics > Debug)
PostFxProfiler = 0                            // 1: GPU time of each effect and of the game's passes to GTAIV.EFLC.FusionFix.PostFx.log every 120 frames
Profiler = 0                                  // samples a second (e.g. 500) of the busiest threads: where each is and what called it; every ProfilerInterval s their CPU time and busiest functions to GTAIV.EFLC.FusionFix.Profiler.log, every call stack of the session to Profiler.folded (flame graphs); each sample stops a thread for an instant, at 1000 it took 10-20% of a core; the debug server (cpu_profile) runs it on its own when off | 0: off (restart)
ProfilerThreads = 4                           // how many of the busiest threads are sampled (the main thread always), 1 to 32
ProfilerInterval = 30                         // seconds a report, 5 to 600
ProfilerSpikeMs = 50                          // a frame of the main thread longer than this gets its own block in the log: where the main thread was and what the two busiest threads did meanwhile | 0: off
WetGroundDebug = 0                            // 1: material categories in colours | 2: wetness red, puddles green, rings blue (also Graphics > Debug)
CloudShadowsDebug = 0                         // 1: the whole ground in cloud shadow | 2: the raw cloud noise (also Graphics > Debug)
AerialPerspectiveDebug = 0                    // 1: the air 25 times as thick, to see where the aerial perspective falls (also Graphics > Debug)
VolumetricCloudsDebug = 0                     // 1: grey at the matched sky brightness | 2 to 14: one term of the clouds' light in colours (also Graphics > Debug)
VehicleBoxShadowsLog = 0                      // 1: the box shadows of the car nearest you to GTAIV.EFLC.FusionFix.VehicleBoxShadows.log
FrameGenerationDebug = 0                      // logs, bits | 2: where the generated frames fall (slow) | 8: pacing
FrameGenerationDebugView = 0                  // 1: a square, magenta on generated frames | 2: generated frames only | 3: both (also Graphics > Debug)
UpscalerTimingLog = 0                         // 1: CPU time of the DLSS / FSR and frame generation exchange to GTAIV.EFLC.FusionFix.Upscaler.log
GroundSurfacesDebug = 0                       // 1: ground shaders in colours, and F10 logs how often each is used to GTAIV.EFLC.FusionFix.Ground.log (also Graphics > Debug)
ProceduralLog = 0                             // 1: the generator's time and limits to GTAIV.EFLC.FusionFix.Procedural.log every 30 s | 2: every event too (restart)
EntityDrawLog = 0                             // 1: draws of buildings, props, vehicles and peds and their CPU time per pass to GTAIV.EFLC.FusionFix.EntityClass.log every 600 frames
GrassWindDebug = 0                            // 1: the grass sways four times as hard, to see which plants take the wind (also Graphics > Debug)
GrassWindLog = 0                              // 1: the wind, grass draws per pass and the grass models' heights to GTAIV.EFLC.FusionFix.GrassWind.log every 600 frames
DeviceResetLog = 0                            // 1: books every default pool resource, a failed device reset (fatal DD3D80) lists those still alive to GTAIV.EFLC.FusionFix.DeviceReset.log (restart)
GpuGrassLog = 0                               // 1: GPU grass: ground triangles, pieces and blades drawn per frame to GTAIV.EFLC.FusionFix.GpuGrass.log every 600 frames
FarPropInstancingLog = 0                      // 1: Far Prop Instancing: instances, groups, instanced draws and fallbacks per pass to GTAIV.EFLC.FusionFix.FarPropInstancing.log every 600 frames
SkyTrace = 0                                  // 1: the sky dome's draws (textures, sampler states, cloud parameters) to GTAIV.EFLC.FusionFix.SkyTrace.log, each change as it happens; Ctrl+Shift+F6 saves the sky as the game drew it (before fog and post effects) to GTAIV.EFLC.FusionFix.SkyCapture<n>_<call>.dds
DebugServerPort = 0                           // a port (e.g. 5051): a debug server on 127.0.0.1 for reading game memory, patterns, the ini and logs from a tool (tools/gta4-live-mcp in the recomp) | 0: off (restart)
DebugServerAllowWrite = 0                     // 1: the debug server may also write game memory and trace code (hooks, debug registers) (restart)
